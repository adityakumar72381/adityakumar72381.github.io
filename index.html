<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="page">
    <div class="admin-wrapper" id="admin">

      <h1 class="admin-title">Admin Panel</h1>
      <p class="admin-subtitle">
        Configure API token and generate final links
      </p>

      <!-- TOKEN CARD -->
      <div class="card" id="tokenCard">
        <label class="label">API Token</label>
        <input
          id="tokenInput"
          type="password"
          placeholder="example.com"
          class="input"
        />
        <button class="btn secondary" onclick="saveToken()">
          Save Token
        </button>
      </div>

      <!-- UPDATE TOKEN -->
      <button class="btn settings hidden" id="updateTokenBtn" onclick="showToken()">
        ⚙️ Update Token
      </button>

      <!-- LINK CARD -->
      <div class="card">
        <label class="label">Input Link</label>
        <input
          id="linkInput"
          type="text"
          placeholder="example.com"
          class="input"
        />

        <button class="btn primary" onclick="generateLink()">
          Generate Final Link
        </button>

        <!-- OUTPUT -->
        <div class="output hidden" id="outputBox">
          <span class="label">Final Link</span>
          <div class="output-row">
            <div id="finalLink" class="output-text"></div>
            <button class="copy-btn" onclick="copyLink()">Copy</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>

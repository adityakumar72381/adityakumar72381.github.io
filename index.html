<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoVerse Bypass</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d0d0d;
            color: #fff;
            padding: 30px;
        }
        .box {
            max-width: 500px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #005fcc;
        }
        .result {
            margin-top: 20px;
            background: #111;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        a {
            color: #4da3ff;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🔗 AutoVerse Link Bypass</h2>
    <input type="text" id="urlInput" placeholder="Paste your link here...">
    <button onclick="bypass()">Bypass Now</button>

    <div id="result" class="result"></div>
</div>

<script>
async function bypass() {
    const url = document.getElementById("urlInput").value.trim();
    const resultBox = document.getElementById("result");

    if (!url) {
        alert("Please enter a URL.");
        return;
    }

    resultBox.style.display = "block";
    resultBox.innerHTML = "⏳ Processing your request...";

    try {
        const response = await fetch("https://disciplines-jackie-distributions-peak.trycloudflare.com/bypass", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-API-Key": "a1d2i3t4y5a6"
            },
            body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (data.error) {
            resultBox.innerHTML = `
                ❌ <b>Bypass Failed</b><br><br>
                <b>Error:</b> ${data.error}
            `;
            return;
        }

        resultBox.innerHTML = `
            ✅ <b>Bypass Successful</b><br><br>
            <b>Original:</b><br>${url}<br><br>

            <b>Bypassed:</b><br>
            <a href="${data.bypassed}" target="_blank">${data.bypassed}</a><br><br>

            ${data.embed ? `<b>Embed:</b><br><a href="${data.embed}" target="_blank">${data.embed}</a><br><br>` : ""}

            <b>Time Taken:</b> ${data.elapsed_s} seconds<br><br>

            <i>Powered by AutoVerse Backend</i>
        `;

    } catch (e) {
        resultBox.innerHTML = `
            ❌ <b>Bypass Failed</b><br><br>
            Error: ${e}
        `;
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manual Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="verify.css">
</head>
<body>

  <!-- Background -->
  <div class="grid-bg"></div>
  <div class="snow" id="snow"></div>

  <!-- Page -->
  <main class="page">
    <div class="verify-box">

      <!-- OPTIONAL AD -->
      <a
        href="https://example.com"
        target="_blank"
        class="ad-badge"
        id="adBadge"
      >
        <img src="https://files.catbox.moe/9ac7qz.png" alt="Ad">
      </a>

      <h1 class="title">Manual Verification Required</h1>
      <p class="subtitle">
        Please complete the verification below to continue.
      </p>

      <!-- Turnstile placeholder -->
      <div class="turnstile">
        Turnstile widget goes here
      </div>

      <!-- Action button -->
      <button class="action-btn" id="actionBtn" disabled>
        Please wait
      </button>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Footer -->
      <p class="footer-text">
        Created by
        <a href="https://t.me/Obsidian_Bots" target="_blank" rel="noopener">
          Obsidian Bots
        </a>
      </p>

    </div>
  </main>

  <script src="verify.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Inter font (same as before) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Existing background CSS -->
  <link rel="stylesheet" href="background.css">

  <!-- Admin specific styles -->
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Shared background -->
  <div class="grid-bg"></div>
  <div id="particles" class="particles"></div>

  <main class="page">
    <div class="admin-wrapper animate-in">

      <h1 class="admin-title">Admin Panel</h1>
      <p class="admin-subtitle">Configure API token and generate final links</p>

      <!-- Token Card -->
      <div class="card">
        <label class="label">API Token</label>
        <input
          id="tokenInput"
          type="password"
          placeholder="Enter API token"
          class="input"
        />
        <button class="btn secondary" onclick="saveToken()">Save Token</button>
      </div>

      <!-- Link Card -->
      <div class="card">
        <label class="label">Input Link</label>
        <input
          id="linkInput"
          type="text"
          placeholder="Paste link here"
          class="input"
        />

        <button class="btn primary" onclick="generateLink()">
          Generate Final Link
        </button>

        <div class="output">
          <span class="output-label">Final Link</span>
          <div id="outputLink" class="output-box">
            —
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="background.js"></script>
  <script src="admin.js"></script>
</body>
</html>

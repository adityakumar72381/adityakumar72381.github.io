<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POST PASTE</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    a { text-decoration: none; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .site-name {
      font-size: 1.8em;
      font-weight: bold;
      background: linear-gradient(90deg, #ff5f6d, #ffc371, #47caff, #ff5f6d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .site-name a { color: inherit; }
    .theme-toggle {
      cursor: pointer;
      width: 30px;
      height: 30px;
      transition: transform 0.3s;
    }
    .theme-toggle:hover { transform: rotate(20deg); }
    .description {
      font-weight: bold;
      font-size: 1.2em;
      margin: 20px;
      color: #00ffea;
    }
    .gallery { padding: 0 10px; margin-top: 10px; }
    .gallery img {
      width: calc(100% - 20px);
      max-width: 100%;
      display: block;
      margin: 10px auto;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.8s ease forwards;
    }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    .urls-block {
      margin: 20px auto;
      max-width: 500px;
      text-align: left;
    }
    .urls-block a {
      display: block;
      margin: 8px 0;
      padding: 10px;
      background: #222;
      border-radius: 6px;
      color: #00ffea;
      font-weight: bold;
      transition: background 0.3s;
    }
    .urls-block a:hover { background: #333; }
    .uploaded-by {
      margin-top: 20px;
      font-size: 1em;
      color: #ccc;
    }
    .uploaded-by a {
      color: #00ffea;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .uploaded-by svg { width: 20px; height: 20px; fill: #00ffea; }
    .yellow-banner {
      display: none;
      position: relative;
      background: #FFD600;
      color: #000;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      max-width: 500px;
      text-align: center;
      font-weight: bold;
      animation: slideUp 0.6s ease forwards;
    }
    .yellow-banner .btn-telegram {
      display: block;
      background: #000;
      color: #FFD600;
      padding: 12px 20px;
      margin: 15px auto 0;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.3s;
    }
    .yellow-banner .btn-telegram:hover { background: #222; }
    .yellow-banner .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 20px;
      cursor: pointer;
      color: #000;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .landing {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    .landing img.logo {
      width: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
    }
    .landing h1 {
      font-size: 2em;
      text-transform: uppercase;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px #00ffea, 0 0 10px #00ffea; }
      to { text-shadow: 0 0 20px #00ffea, 0 0 40px #00ffea; }
    }
    .btn {
      display: inline-block;
      background: #00ffea;
      color: #111;
      padding: 10px 18px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn:hover { background: #00c7b5; }
    footer { margin: 30px 0 20px; font-size: 0.9em; color: #888; }
    footer a { color: #00ffea; }
  </style>
</head>
<body>
  <header>
    <div class="site-name"><a href="/">POST PASTE</a></div>
    <svg id="themeToggle" class="theme-toggle" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"
        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
    </svg>
  </header>

  <main id="content"></main>

  <footer>
    © POST PASTE cc || powered by 
    <a href="https://t.me/automated_world" target="_blank">@automated_world</a>
  </footer>

  <script>
    const escapeHTML = (str = '') => str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    async function fetchPostData(hash) {
      try {
        const res = await fetch("https://toolbox-graphs-finance-collectors.trycloudflare.com/fetch_post", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "x-api-key": "1"
          },
          body: JSON.stringify({ hash })
        });
        return await res.json();
      } catch (err) {
        console.error(err);
        return null;
      }
    }

    function renderLanding() {
      document.getElementById("content").innerHTML = `
        <div class="landing">
          <img class="logo" src="https://files.catbox.moe/07peh0.jpg" alt="Automated World Logo">
          <h1>WELCOME TO AUTOMATED WORLD</h1>
          <a class="btn" href="https://t.me/automated_world" target="_blank">JOIN CHANNEL</a>
          <div class="section">
            <h2>ABOUT THIS SITE</h2>
            <p>POST PASTE helps you share photo collections easily. Display posts with multiple images and creator info dynamically.</p>
          </div>
          <a class="btn" href="https://t.me/Yoursadityaaa" target="_blank">CREATE YOUR OWN POST</a>
        </div>`;
    }

    async function renderPost(hash) {
      const data = await fetchPostData(hash);
      if (!data || !data.description) {
        renderLanding();
        return;
      }

      let html = '';
      html += `<div class="description">${escapeHTML(data.description)}</div>`;
      if (Array.isArray(data.urls)) {
        html += '<div class="urls-block">';
        for (const link of data.urls) {
          html += `<a href="${escapeHTML(link)}" target="_blank">${escapeHTML(link)}</a>`;
        }
        html += '</div>';
      } else if (Array.isArray(data.images)) {
        html += '<div class="gallery">';
        let delay = 0;
        for (const img of data.images) {
          html += `<img src="${escapeHTML(img.url)}" style="animation-delay:${delay}s;" loading="lazy">`;
          delay += 0.3;
        }
        html += '</div>';
      }

      if (data.creator_name && data.creator_url) {
        html += `
        <div class="uploaded-by">
          <a href="${escapeHTML(data.creator_url)}" target="_blank">
            Uploaded by ${escapeHTML(data.creator_name)}
          </a>
        </div>`;
      }

      html += `
      <div id="yellowBanner" class="yellow-banner">
        <span class="close-btn">&times;</span>
        <div>WANT TO CREATE SUCH POST ??</div>
        <a class="btn-telegram" href="https://t.me/Yoursadityaaa" target="_blank">
          MESSAGE ME ON TELEGRAM
        </a>
      </div>`;
      document.getElementById("content").innerHTML = html;

      setTimeout(() => {
        const banner = document.getElementById('yellowBanner');
        if (banner) banner.style.display = 'block';
      }, 3000);
    }

    const path = location.pathname.replace(/^\//, '').trim();
    if (path) renderPost(path);
    else renderLanding();

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('close-btn')) {
        document.getElementById('yellowBanner').style.display = 'none';
      }
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
    });
  </script>
</body>
</html>
